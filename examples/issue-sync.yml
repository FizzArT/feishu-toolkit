# GitHub Issue → 飞书多维表格（标准需求/Bug 看板）同步
#
# 两种触发：
#   1. Issue 事件（新建 / 编辑 / 重开 / 关闭 / 打标签等）：只同步这一条，秒级；
#   2. 手动 workflow_dispatch 或定时 schedule：全量兜底（open + closed）。
#
# 使用：
#   1. 复制到目标仓库 .github/workflows/issue-sync.yml；
#   2. Settings → Secrets and variables → Actions 添加：
#        FEISHU_APP_ID       必填
#        FEISHU_APP_SECRET   必填
#        FEISHU_APP_TOKEN    必填，目标看板 app_token
#        FEISHU_USER_MAP     可选，JSON：{"github_login":"本应用 open_id"}
#   注意：open_id 必须是「当前这个自建应用」视角下的 open_id（跨应用不可用）；
#   未配置 user_map 的人员字段会自动跳过，不影响同步。

name: Sync GitHub Issues to Feishu

on:
  issues:
    types: [opened, edited, reopened, closed, assigned, unassigned, labeled, unlabeled]
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时全量兜底，按需调整

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feishu-toolkit
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/FizzArT/feishu-toolkit.git@main"

      - name: Prepare issue payload (single event)
        if: github.event_name == 'issues'
        env:
          ISSUE: ${{ toJson(github.event.issue) }}
        run: |
          python - <<'PY'
          import json, os
          issue = json.loads(os.environ["ISSUE"])
          if "pull_request" in issue:
              raise SystemExit(0)
          with open("/tmp/issues.json", "w", encoding="utf-8") as f:
              json.dump([issue], f)
          print("payload: 1 issue #", issue.get("number"))
          PY

      - name: Prepare issue payload (full fetch)
        if: github.event_name != 'issues'
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          issues = []
          for state in ("open", "closed"):
              page = 1
              while True:
                  url = (f"https://api.github.com/repos/{repo}/issues"
                         f"?state={state}&per_page=100&page={page}")
                  req = urllib.request.Request(url, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urllib.request.urlopen(req, timeout=30) as r:
                      batch = json.load(r)
                  batch = [i for i in batch if "pull_request" not in i]
                  if not batch:
                      break
                  issues.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
          with open("/tmp/issues.json", "w", encoding="utf-8") as f:
              json.dump(issues, f)
          print("payload:", len(issues), "issues")
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to Feishu
        if: always()
        run: |
          if [ -f /tmp/issues.json ]; then
            feishu-toolkit github-sync /tmp/issues.json
          else
            echo "跳过：无 issue 负载（可能是 PR 事件）"
          fi
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_USER_MAP: ${{ secrets.FEISHU_USER_MAP }}
