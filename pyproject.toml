[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-toolkit"
version = "0.1.0"
description = "飞书集成工具（Feishu Toolkit）：飞书开放平台 Python SDK，首批提供多维表格（Bitable）与标准看板能力"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FizzArT" }]
keywords = ["feishu", "lark", "bitable", "飞书", "多维表格", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/FizzArT/feishu-toolkit"
Repository = "https://github.com/FizzArT/feishu-toolkit"
Issues = "https://github.com/FizzArT/feishu-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
